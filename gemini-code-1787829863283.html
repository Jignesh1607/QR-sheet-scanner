<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supertron VAD - Universal QR Scanner & Lead Collector</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML5 QR Code Scanner CDN -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      background: url('bg img.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="font-sans min-h-screen text-gray-800 p-4 max-w-3xl mx-auto">

  <!-- Header Section with Supertron VAD Logo -->
  <header class="glass-card rounded-2xl p-4 my-6 shadow-xl border border-white/40 flex flex-col sm:flex-row items-center justify-between gap-4">
    <img src="Supertron-VAD-500-500-trans-logo.png" alt="Supertron VAD Logo" class="h-14 object-contain bg-white/80 p-1.5 rounded-lg shadow-sm" />
    <div class="text-center sm:text-right">
      <h1 class="text-xl font-extrabold text-blue-900 tracking-tight">QR Lead Collector</h1>
      <p class="text-xs text-gray-600 font-medium">Decodes & Syncs Directly to Google Sheets</p>
    </div>
  </header>

  <!-- Scanner Container -->
  <main class="glass-card p-5 rounded-2xl shadow-2xl border border-white/50">
    <div id="reader" class="overflow-hidden rounded-xl border border-gray-200 shadow-inner bg-black/5"></div>

    <!-- Manual Capture Button -->
    <div class="mt-4 text-center">
      <button onclick="manualCapture()" class="w-full bg-gradient-to-r from-blue-700 to-indigo-800 hover:from-blue-800 hover:to-indigo-900 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition transform active:scale-[0.99] flex items-center justify-center gap-2 text-sm sm:text-base">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 001.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        📷 Freeze & Capture Frame
      </button>
    </div>
  </main>

  <!-- Confirmation Modal -->
  <div id="confirmModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-gray-100 max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between pb-3 border-b border-gray-100">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 bg-green-100 text-green-600 rounded-full flex items-center justify-center font-bold">✓</div>
          <h3 class="text-lg font-bold text-gray-800">QR Decoded & Snapshot Captured</h3>
        </div>
      </div>
      
      <!-- Captured Image Preview -->
      <div class="my-4 flex justify-center">
        <img id="qrPhotoPreview" class="w-36 h-36 object-cover border-2 border-indigo-600 rounded-xl shadow-md bg-gray-50" alt="Captured QR" />
      </div>

      <!-- Decoded Data Preview -->
      <div id="previewContainer" class="bg-gray-50 border border-gray-200 rounded-xl p-3.5 text-left text-xs space-y-1.5 overflow-y-auto max-h-44 mb-4"></div>

      <button id="saveBtn" onclick="saveAndSend()" class="w-full bg-gradient-to-r from-red-600 to-blue-800 hover:from-red-700 hover:to-blue-900 text-white font-bold py-3.5 px-4 rounded-xl transition shadow-lg text-sm">
        Save Data + Image to Sheet ➔
      </button>
    </div>
  </div>

  <!-- Stats & Quick Sheet Link -->
  <section class="flex justify-between items-center my-6 glass-card p-4 rounded-2xl shadow-xl border border-white/50">
    <div>
      <span class="text-gray-600 text-xs sm:text-sm font-medium">Total Synced Scans:</span>
      <span id="leadCount" class="text-xl font-black text-blue-900 ml-1">0</span>
    </div>
    <a href="https://docs.google.com/spreadsheets/d/1d88LuC4XpylVjnfO-WrQ7r2LdRaSNy7VyvT9YvStPnQ/edit?usp=sharing" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs sm:text-sm transition flex items-center gap-2 shadow-md">
      📊 Open Google Sheet
    </a>
  </section>

  <!-- Recent Table -->
  <section class="glass-card rounded-2xl shadow-xl border border-white/50 overflow-hidden mb-12">
    <div class="p-4 border-b border-gray-200/80 font-bold text-gray-800 text-sm flex items-center justify-between">
      <span>Recent Scanned Records</span>
      <span class="text-xs font-normal text-gray-500">Supertron VAD Collector</span>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs text-gray-600">
        <thead class="bg-blue-50/60 uppercase text-gray-600 font-semibold border-b border-gray-200/50">
          <tr>
            <th class="p-3">#</th>
            <th class="p-3">Name / Primary</th>
            <th class="p-3">Company</th>
            <th class="p-3">Badge ID</th>
            <th class="p-3">Time</th>
          </tr>
        </thead>
        <tbody id="leadTable" class="divide-y divide-gray-100"></tbody>
      </table>
    </div>
  </section>

  <script>
    // Paste your Web App URL here from Google Apps Script deployment
    const GOOGLE_SHEET_WEBHOOK_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

    let leads = JSON.parse(localStorage.getItem('supertron_qr_records')) || [];
    let pendingRecord = null;
    let html5QrCode = null;

    function captureScannerCanvas() {
      const videoElem = document.querySelector("#reader video");
      if (!videoElem) return null;
      
      const canvas = document.createElement("canvas");
      canvas.width = videoElem.videoWidth || 300;
      canvas.height = videoElem.videoHeight || 300;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(videoElem, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/png");
    }

    function decodePayload(rawText) {
      let decoded = { Timestamp: new Date().toLocaleString(), "Raw Payload": rawText };
      const cleanText = rawText.trim();

      if (cleanText.includes('BEGIN:VCARD')) {
        cleanText.split('\n').forEach(line => {
          const trimmed = line.trim();
          if (trimmed.startsWith('FN:')) decoded["Full Name"] = trimmed.replace('FN:', '').trim();
          else if (trimmed.startsWith('ORG:')) decoded["Company / Org"] = trimmed.replace('ORG:', '').trim();
          else if (trimmed.startsWith('EMAIL')) decoded["Email"] = trimmed.replace(/^EMAIL(;[^:]+)?:/i, '').trim();
          else if (trimmed.startsWith('NOTE:') || trimmed.startsWith('ID:')) decoded["Badge ID / Notes"] = trimmed.replace(/NOTE:|ID:/g, '').trim();
        });
      } else if (cleanText.startsWith('{') && cleanText.endsWith('}')) {
        try {
          const jsonObj = JSON.parse(cleanText);
          Object.assign(decoded, jsonObj);
        } catch (e) {
          decoded["Content"] = cleanText;
        }
      } else if (cleanText.includes('|') || cleanText.includes(',')) {
        const delimiter = cleanText.includes('|') ? '|' : ',';
        const parts = cleanText.split(delimiter);
        parts.forEach((part, idx) => { decoded[`Field_${idx + 1}`] = part.trim(); });
      } else {
        decoded["Content"] = cleanText;
      }
      return decoded;
    }

    function renderLeads() {
      const tbody = document.getElementById('leadTable');
      document.getElementById('leadCount').innerText = leads.length;
      tbody.innerHTML = '';
      
      leads.forEach((record, index) => {
        const name = record["Full Name"] || record["name"] || record["Field_1"] || record["Content"] || "N/A";
        const company = record["Company / Org"] || record["company"] || record["org"] || record["Field_2"] || "N/A";
        const badgeId = record["Badge ID / Notes"] || record["badgeId"] || record["id"] || record["Field_3"] || "N/A";

        const row = `<tr class="hover:bg-white/60">
          <td class="p-3 font-medium text-gray-900">${index + 1}</td>
          <td class="p-3 font-semibold text-gray-800">${name}</td>
          <td class="p-3">${company}</td>
          <td class="p-3 font-mono text-xs text-indigo-700">${badgeId}</td>
          <td class="p-3 text-gray-400 text-xs">${record.Timestamp}</td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }

    function processScan(decodedText) {
      if (html5QrCode) html5QrCode.pause(true);
      
      const capturedImageData = captureScannerCanvas();
      pendingRecord = decodePayload(decodedText || "Manual Scan Captured");
      pendingRecord.imageData = capturedImageData;

      document.getElementById('qrPhotoPreview').src = capturedImageData;
      const previewContainer = document.getElementById('previewContainer');
      previewContainer.innerHTML = '';
      
      Object.entries(pendingRecord).forEach(([key, value]) => {
        if (key !== 'Timestamp' && key !== 'imageData') {
          previewContainer.innerHTML += `<div><span class="font-bold uppercase text-gray-500">${key}:</span> ${value}</div>`;
        }
      });

      document.getElementById('confirmModal').classList.remove('hidden');
    }

    function onScanSuccess(decodedText) {
      processScan(decodedText);
    }

    function manualCapture() {
      const capturedImageData = captureScannerCanvas();
      if (!capturedImageData) return;

      if (html5QrCode) html5QrCode.pause(true);

      pendingRecord = {
        Timestamp: new Date().toLocaleString(),
        "Raw Payload": "Manual Snapshot Capture",
        "Content": "Manual Photo Snapshot",
        imageData: capturedImageData
      };

      document.getElementById('qrPhotoPreview').src = capturedImageData;
      const previewContainer = document.getElementById('previewContainer');
      previewContainer.innerHTML = `<div><span class="font-bold uppercase text-gray-500 font-semibold">Mode:</span> Manual Snapshot Captured</div>`;

      document.getElementById('confirmModal').classList.remove('hidden');
    }

    async function saveAndSend() {
      if (pendingRecord) {
        const btn = document.getElementById('saveBtn');
        btn.innerText = "Uploading Photo & Syncing...";
        btn.disabled = true;

        if (GOOGLE_SHEET_WEBHOOK_URL && GOOGLE_SHEET_WEBHOOK_URL !== "https://script.google.com/macros/s/AKfycbyLt3Twu1c8dv0U4A6AwqYVXiSae9oZWthf4Wbh4c4A75fXApJMcI2B9AEXkoYhirrpjg/exec") {
          try {
            await fetch(GOOGLE_SHEET_WEBHOOK_URL, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(pendingRecord)
            });
          } catch (e) {
            console.error("Upload error:", e);
          }
        }

        leads.unshift(pendingRecord);
        localStorage.setItem('supertron_qr_records', JSON.stringify(leads));
        renderLeads();

        btn.innerText = "Save Data + Image to Sheet ➔";
        btn.disabled = false;
        pendingRecord = null;
      }
      document.getElementById('confirmModal').classList.add('hidden');
      if (html5QrCode) html5QrCode.resume();
    }

    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, onScanSuccess);

    renderLeads();
  </script>
</body>
</html>
